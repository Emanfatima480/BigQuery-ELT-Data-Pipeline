version: 2

models:

  - name: stg_customers
    description: "Staging model for Olist customers."
    columns:
      - name: customer_id
        description: "Unique identifier for each customer order record."
        data_tests:
          - not_null
          - unique

      - name: customer_unique_id
        description: "Unique identifier representing the actual customer."
        data_tests:
          - not_null

  - name: stg_orders
    description: "Staging model for Olist orders."
    columns:
      - name: order_id
        description: "Unique identifier for each order."
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: "Identifier of the customer who placed the order."
        data_tests:
          - not_null

  - name: stg_order_items
    description: "Staging model for items belonging to each order."
    columns:
      - name: order_id
        description: "Identifier of the order."
        data_tests:
          - not_null

      - name: product_id
        description: "Identifier of the product."
        data_tests:
          - not_null

      - name: seller_id
        description: "Identifier of the seller."
        data_tests:
          - not_null
